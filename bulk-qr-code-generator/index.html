<main class="ws-page" data-qr-page>
  <div class="ws-head wrap"><div><p class="crumb"><a href="../tools.html">Tools</a><span>/</span>Bulk QR codes</p><h1>Bulk QR code generator</h1><p class="lead">Paste a list or load a CSV. Get one ZIP with a code for every line. Free.</p></div></div>
  <div class="qr wrap one"><section class="qcard" aria-label="Bulk codes"><div class="qf"><label class="lbl" for="qType">What should the code do?</label><select class="dd" id="qType"><option value="url" selected>Website link</option><option value="text">Text</option><option value="phone">Phone number</option><option value="whatsapp">WhatsApp message</option><option value="instagram">Instagram profile</option><option value="tiktok">TikTok profile</option><option value="youtube">YouTube link</option><option value="review">Google review link</option><option value="appstore">App store link</option></select></div><div class="qf"><label class="lbl" for="bList">One entry per line</label><textarea id="bList" rows="10" placeholder="https://example.com/one&#10;https://example.com/two"></textarea></div><div class="qgrid"><div class="qc wide"><label class="check"><input type="checkbox" id="bNamed"><span>Lines look like: file name, value</span></label></div><div class="optfield"><label class="lbl" for="bFmt">File type</label><select class="dd" id="bFmt"><option value="png">PNG</option><option value="svg">SVG</option></select></div><div class="optfield"><label class="lbl" for="qSize">PNG size</label><select class="dd" id="qSize"><option value="512">512 px</option><option value="1024" selected>1024 px</option><option value="2048">2048 px</option></select></div><div class="qc"><label class="lbl" for="bCsv">Or load a CSV or text file</label><input id="bCsv" type="file" accept=".csv,.txt,text/csv,text/plain"></div></div><label class="field" for="outName">File name<span class="name"><input id="outName" type="text" value="Dilia-qr-codes" spellcheck="false" autocomplete="off"></span></label><button class="btn go" type="button" id="bGo"><span class="go-l">Make codes and download ZIP</span><span class="go-p" aria-hidden="true"><i id="bProg"></i></span></button><p class="note">Up to 2000 lines. Codes use the default black on white design. Each line becomes one file.</p><p class="safe"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v6c0 4.4 3 7.8 7 9 4-1.2 7-4.6 7-9V6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m9 12 2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Made in this tab. Nothing is uploaded or stored.</p></section></div>
