  <div class="ws-head wrap"><div><p class="crumb"><a href="../tools.html">Tools</a><span>/</span>Text to QR code</p><h1>Text to QR code</h1><p class="lead">Turn any text into a QR code.</p></div></div>
  <div class="qr wrap"><section class="qcard" aria-label="Content"><div id="qfields"></div><details class="qd" id="qdesign" open><summary>Colours and shape</summary><div class="qgrid"><div class="qc"><label class="lbl" for="qC1">Code colour</label><input id="qC1" type="color" value="#000000"></div><div class="qc" id="qC2w" hidden><label class="lbl" for="qC2">Second colour</label><input id="qC2" type="color" value="#e5007d"></div><div class="qc"><label class="lbl" for="qBg">Background</label><input id="qBg" type="color" value="#ffffff"></div><div class="qc wide"><label class="check"><input type="checkbox" id="qGrad"><span>Gradient</span></label> <label class="check"><input type="checkbox" id="qTransp"><span>Transparent background (PNG, SVG)</span></label></div><div class="optfield"><label class="lbl" for="qGdir">Gradient direction</label><select class="dd" id="qGdir"><option value="diag">Diagonal</option><option value="h">Left to right</option><option value="v">Top to bottom</option></select></div><div class="optfield"><label class="lbl" for="qDot">Dot shape</label><select class="dd" id="qDot"><option value="square">Square</option><option value="round">Rounded</option><option value="dot">Dots</option></select></div><div class="optfield"><label class="lbl" for="qEyeShape">Corner shape</label><select class="dd" id="qEyeShape"><option value="square">Square</option><option value="round">Rounded</option></select></div><div class="qc wide"><label class="check"><input type="checkbox" id="qEyeSame" checked><span>Corners use the code colour</span></label></div><div class="qc" id="qEyew" hidden><label class="lbl" for="qEye">Corner colour</label><input id="qEye" type="color" value="#000000"></div></div></details><details class="qd"><summary>Logo and frame</summary><div class="qgrid"><div class="qc wide"><label class="lbl" for="qLogo">Logo in the middle (PNG, JPG, WebP or SVG)</label><input id="qLogo" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"></div><div class="qc" id="qLogow" hidden><label class="lbl" for="qLogoSize">Logo size <output id="qLogoSizeo">20</output>%</label><input id="qLogoSize" type="range" min="8" max="30" value="20"><button type="button" class="btn ghost sm" id="qLogoClear">Remove logo</button></div><div class="optfield"><label class="lbl" for="qFrame">Frame</label><select class="dd" id="qFrame"><option value="none">No frame</option><option value="box">Box</option><option value="label">Box with text</option></select></div><div class="qf" id="qFtw" hidden><label class="lbl" for="qFtext">Frame text</label><input id="qFtext" type="text" value="SCAN ME" maxlength="24"></div></div></details><details class="qd"><summary>Size and accuracy</summary><div class="qgrid"><div class="optfield"><label class="lbl" for="qEcc">Error correction</label><select class="dd" id="qEcc"><option value="auto">Automatic</option><option value="L">Low (7%)</option><option value="M">Medium (15%)</option><option value="Q">Quarter (25%)</option><option value="H">High (30%)</option></select></div><div class="optfield sm"><label class="lbl" for="qMargin">Quiet border</label><span class="name"><input id="qMargin" type="number" min="0" max="10" step="1" value="4"><em>modules</em></span></div><div class="optfield"><label class="lbl" for="qSize">Download size</label><select class="dd" id="qSize"><option value="512">512 px</option><option value="1024" selected>1024 px</option><option value="2048">2048 px</option><option value="4000">4000 px</option></select></div></div></details></section><aside class="qside"><div class="qbox"><div class="qprev" id="qprev" aria-live="polite"></div><p class="qstat" id="qstat" aria-live="polite"></p><div id="qwarn"></div><label class="field" for="outName">File name<span class="name"><input id="outName" type="text" value="Dilia-qr-code" spellcheck="false" autocomplete="off"></span></label><div class="qdl"><button class="btn go" type="button" data-dl="png" disabled>Download PNG</button><button class="btn ghost" type="button" data-dl="svg" disabled>SVG</button><button class="btn ghost" type="button" data-dl="pdf" disabled>PDF</button><button class="btn ghost" type="button" data-dl="jpg" disabled>JPG</button></div><p class="note">Static code: it works forever and never expires. SVG and PDF are print ready.</p><p class="safe"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v6c0 4.4 3 7.8 7 9 4-1.2 7-4.6 7-9V6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m9 12 2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Made in this tab. Nothing is uploaded or stored.</p></div></aside></div>
