name: desktop
# Builds and tests the Dilia PDF Windows app on a real Windows machine.
# Push to branch desktop-ci = build + test only. Push to branch desktop-release = build + test + publish the installer
# as a GitHub release tagged desktop-v<version from desktop/package.json>.
on:
  push:
    branches: [desktop-ci, desktop-release]
permissions: { contents: write }
concurrency: { group: desktop, cancel-in-progress: false }
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults: { run: { shell: pwsh } }
    steps:
      - name: Keep files byte-for-byte (no CRLF conversion)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report paths (outside the repo folder)
        run: |
          "REPORT=$env:RUNNER_TEMP\report.txt", "SHOT=$env:RUNNER_TEMP\screen.png", "APPSHOT=$env:RUNNER_TEMP\app.png", "DILIA_SHOT=$env:RUNNER_TEMP\app.png" | Add-Content $env:GITHUB_ENV
      - name: Report header
        run: Set-Content $env:REPORT "Dilia PDF Windows build $env:GITHUB_REF_NAME $env:GITHUB_SHA $(Get-Date -Format o) $((Get-CimInstance Win32_OperatingSystem).Caption)"
      - name: Install build tools (exact versions, package-lock)
        working-directory: desktop
        run: npm ci --no-fund
      - name: Build tools audit (recorded, not shipped in the app)
        working-directory: desktop
        run: npm audit --omit=dev 2>&1 | Tee-Object -Append -FilePath $env:REPORT; exit 0
      - name: App test on Windows (drives the real app)
        working-directory: desktop
        run: |
          npx electron --version | Out-Host
          node copy-site.js 2>&1 | Tee-Object -Variable cs | Out-Host
          $code = $LASTEXITCODE
          $cs | Add-Content $env:REPORT
          if ($code) { exit $code }
          "headers: " + ((Get-Content site/headers.json -Raw) -replace '\s+', ' ').Substring(0, 120) | Add-Content $env:REPORT
          node test/app-test.js 2>&1 | Tee-Object -Variable out | Out-Host
          $code = $LASTEXITCODE
          $out | Where-Object { "$_" -match '^(PASS|FAIL|CRASH|FAILS|ERRS)' } | Add-Content $env:REPORT
          if ($code) { $out | Select-Object -Last 40 | Add-Content $env:REPORT }
          exit $code
      - name: Build installer
        working-directory: desktop
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Installer smoke test (install, open a PDF, uninstall)
        working-directory: desktop
        run: ./test/smoke.ps1
      - name: Publish report to branch desktop-reports
        if: always()
        env: { TOKEN: '${{ github.token }}' }
        run: |
          $rep = Join-Path $env:RUNNER_TEMP rep
          New-Item -ItemType Directory $rep | Out-Null
          Copy-Item $env:REPORT $rep/
          if (Test-Path $env:SHOT) { Copy-Item $env:SHOT $rep/ }
          if (Test-Path $env:APPSHOT) { Copy-Item $env:APPSHOT $rep/ }
          Set-Location $rep
          git init -q -b desktop-reports
          git -c user.name=dilia-ci -c user.email=dilia-ci@users.noreply.github.com add -A
          git -c user.name=dilia-ci -c user.email=dilia-ci@users.noreply.github.com commit -qm "report $env:GITHUB_REF_NAME $env:GITHUB_SHA ${{ job.status }}"
          git push -q --force "https://x-access-token:$env:TOKEN@github.com/$env:GITHUB_REPOSITORY.git" HEAD:desktop-reports
      - name: Publish installer (desktop-release only)
        if: github.ref == 'refs/heads/desktop-release'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          $setup = Get-ChildItem desktop/dist/Dilia-PDF-Setup-*.exe | Select-Object -First 1
          $ver = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          gh release create "desktop-v$ver" $setup.FullName $env:REPORT --target $env:GITHUB_SHA --title "Dilia PDF for Windows $ver" --notes "Download Dilia-PDF-Setup and run it. Windows shows 'Windows protected your PC' because the app is not signed yet: click More info, then Run anyway. Files never leave your computer. report.txt lists the tests this build passed and the installer's SHA256." --prerelease
