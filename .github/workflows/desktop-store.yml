name: desktop-store
# Builds the Microsoft Store package (.appx) of Dilia PDF on a real Windows machine, runs Microsoft's Windows App
# Certification Kit on it when the machine has it, and attaches both to a GitHub pre-release (store-v<version>).
# Trigger: push to branch desktop-store. The package is unsigned on purpose: the Store signs it.
on:
  push:
    branches: [desktop-store]
permissions: { contents: write }
concurrency: { group: desktop-store, cancel-in-progress: false }
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults: { run: { shell: pwsh } }
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools (exact versions, package-lock)
        working-directory: desktop
        run: npm ci --no-fund
      - name: Build the Store package
        working-directory: desktop
        run: |
          node copy-site.js
          npx electron-builder --win appx --x64 --publish never
          Get-ChildItem dist | Out-Host
      - name: Check the package (manifest, identity, files)
        working-directory: desktop
        run: |
          $pkg = Get-ChildItem dist/*.appx | Select-Object -First 1
          "package: $($pkg.Name) $([math]::Round($pkg.Length/1MB,1)) MB" | Tee-Object -FilePath $env:RUNNER_TEMP\store-report.txt
          $kit = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP 'unpacked'
          & $kit.FullName unpack /p $pkg.FullName /d $out /o 2>&1 | Select-Object -Last 3 | Out-Host
          [xml]$m = Get-Content "$out\AppxManifest.xml"
          $id = $m.Package.Identity
          "Identity Name=$($id.Name) Publisher=$($id.Publisher) Version=$($id.Version) Arch=$($id.ProcessorArchitecture)" | Tee-Object -Append -FilePath $env:RUNNER_TEMP\store-report.txt
          "PublisherDisplayName=$($m.Package.Properties.PublisherDisplayName) DisplayName=$($m.Package.Properties.DisplayName)" | Tee-Object -Append -FilePath $env:RUNNER_TEMP\store-report.txt
          "Capabilities: " + (($m.Package.Capabilities.ChildNodes | ForEach-Object { $_.Name + ':' + $_.OuterXml.Substring(0, [math]::Min(80, $_.OuterXml.Length)) }) -join ' | ') | Tee-Object -Append -FilePath $env:RUNNER_TEMP\store-report.txt
          "Extensions: " + $m.Package.Applications.Application.Extensions.OuterXml | Tee-Object -Append -FilePath $env:RUNNER_TEMP\store-report.txt
          "Executable: " + $m.Package.Applications.Application.Executable | Tee-Object -Append -FilePath $env:RUNNER_TEMP\store-report.txt
          if (-not (Test-Path "$out\assets\Square150x150Logo.png")) { "MISSING logo assets" | Tee-Object -Append -FilePath $env:RUNNER_TEMP\store-report.txt; exit 1 }
      - name: Windows App Certification Kit (if this machine has it)
        continue-on-error: true
        working-directory: desktop
        run: |
          $appcert = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit" -Filter appcert.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $appcert) { "WACK: not installed on this machine" | Tee-Object -Append -FilePath $env:RUNNER_TEMP\store-report.txt; exit 0 }
          $pkg = Get-ChildItem dist/*.appx | Select-Object -First 1
          $xml = Join-Path $env:RUNNER_TEMP 'wack.xml'
          & $appcert.FullName reset 2>&1 | Out-Null
          & $appcert.FullName test -appxpackagepath $pkg.FullName -reportoutputpath $xml 2>&1 | Select-Object -Last 15 | Out-Host
          if (Test-Path $xml) {
            [xml]$r = Get-Content $xml
            "WACK overall: " + $r.REPORT.OVERALL_RESULT | Tee-Object -Append -FilePath $env:RUNNER_TEMP\store-report.txt
            foreach ($t in $r.REPORT.REQUIREMENTS.REQUIREMENT) { ($t.NUMBER + ' ' + $t.TITLE + ' : ' + $t.TEST.RESULT) | Tee-Object -Append -FilePath $env:RUNNER_TEMP\store-report.txt }
          } else { "WACK: ran but wrote no report" | Tee-Object -Append -FilePath $env:RUNNER_TEMP\store-report.txt }
      - name: Install the package, start it, remove it (test copy signed with a throwaway certificate; the uploaded file stays unsigned)
        continue-on-error: true
        working-directory: desktop
        run: |
          $R = "$env:RUNNER_TEMP\store-report.txt"
          $pkg = Get-ChildItem dist/*.appx | Select-Object -First 1
          $pub = 'CN=50560FCE-ED5F-4A52-85BF-7B539EB0801D'
          $cert = New-SelfSignedCertificate -Type Custom -Subject $pub -KeyUsage DigitalSignature -FriendlyName 'Dilia test' -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}')
          $pw = ConvertTo-SecureString -String 'test' -Force -AsPlainText
          $pfx = "$env:RUNNER_TEMP\test.pfx"; $cer = "$env:RUNNER_TEMP\test.cer"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          $test = "$env:RUNNER_TEMP\Dilia-test.appx"; Copy-Item $pkg.FullName $test
          $st = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName | Select-Object -Last 1
          & $st.FullName sign /fd SHA256 /f $pfx /p test $test
          if ($LASTEXITCODE -ne 0) { "SIGN TEST COPY: failed" | Tee-Object -Append -FilePath $R; exit 0 }
          try { Add-AppxPackage -Path $test -ErrorAction Stop; "INSTALL: ok" | Tee-Object -Append -FilePath $R }
          catch { "INSTALL: failed: $($_.Exception.Message)" | Tee-Object -Append -FilePath $R; exit 0 }
          $p = Get-AppxPackage -Name Dilia.DiliaPDF
          "INSTALLED: $($p.PackageFamilyName) $($p.Version) at $($p.InstallLocation)" | Tee-Object -Append -FilePath $R
          Copy-Item test/fixtures/ten.pdf "$env:RUNNER_TEMP\Store test.pdf"
          $exe = Join-Path $p.InstallLocation 'app\DiliaPDF.exe'
          "EXE exists: $(Test-Path $exe)" | Tee-Object -Append -FilePath $R
          # 1) activation the way Windows does it for a double-clicked PDF / Start menu tile
          Start-Process explorer.exe "shell:AppsFolder\$($p.PackageFamilyName)!DiliaPDF"
          Start-Sleep -Seconds 15
          $procs = @(Get-Process -Name DiliaPDF -ErrorAction SilentlyContinue)
          "ACTIVATE (start menu): processes=$($procs.Count) windows=$(@($procs | Where-Object { $_.MainWindowHandle -ne 0 }).Count) title='$(($procs | Where-Object { $_.MainWindowTitle } | Select-Object -First 1 -ExpandProperty MainWindowTitle))'" | Tee-Object -Append -FilePath $R
          Get-Process -Name DiliaPDF -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          # 2) open a PDF
          try { $pr = Start-Process $exe -ArgumentList "`"$env:RUNNER_TEMP\Store test.pdf`"" -PassThru -ErrorAction Stop; "START exe: pid=$($pr.Id)" | Tee-Object -Append -FilePath $R } catch { "START exe failed: $($_.Exception.Message)" | Tee-Object -Append -FilePath $R }
          $t = ''
          for ($i = 0; $i -lt 60 -and $t -notmatch 'Store test'; $i++) { Start-Sleep -Milliseconds 500; $t = (Get-Process -Name DiliaPDF -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle } | Select-Object -First 1 -ExpandProperty MainWindowTitle) }
          $procs = @(Get-Process -Name DiliaPDF -ErrorAction SilentlyContinue)
          "OPEN PDF: window title = '$t' processes=$($procs.Count) exited=$($pr.HasExited)" | Tee-Object -Append -FilePath $R
          Get-Process -Name DiliaPDF -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          Remove-AppxPackage -Package $p.PackageFullName
          "REMOVED: still installed = $([bool](Get-AppxPackage -Name Dilia.DiliaPDF))" | Tee-Object -Append -FilePath $R
      - name: Screenshots of the real app window (Store listing images)
        continue-on-error: true
        working-directory: desktop
        run: |
          Add-Type -TypeDefinition @"
          using System; using System.Runtime.InteropServices;
          public class Res {
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Ansi)] public struct DM { [MarshalAs(UnmanagedType.ByValTStr, SizeConst=32)] public string n; public ushort sv, dv, sz, de; public uint f; public int px, py; public uint o, df; public short c, yr, pq, sc, tt; [MarshalAs(UnmanagedType.ByValTStr, SizeConst=32)] public string fn; public ushort lg; public uint bits, w, h, fl, fr; public uint ic, im, mt, dt, r1, r2, pw, ph; }
            [DllImport("user32.dll")] public static extern bool EnumDisplaySettings(string d, int m, ref DM dm);
            [DllImport("user32.dll")] public static extern int ChangeDisplaySettings(ref DM dm, int f);
          }
          "@
          $dm = New-Object Res+DM; $dm.sz = [System.Runtime.InteropServices.Marshal]::SizeOf($dm); $bi = -1; $bw = 0; $bh = 0; $i = 0
          while ([Res]::EnumDisplaySettings($null, $i, [ref]$dm)) { if ($dm.w -ge 1920 -and $dm.h -ge 1080 -and ($bi -lt 0 -or $dm.w * $dm.h -lt $bw * $bh)) { $bi = $i; $bw = $dm.w; $bh = $dm.h }; $i++ }
          "display modes seen: $i; chosen index $bi = ${bw}x${bh}"
          if ($bi -ge 0) { [void][Res]::EnumDisplaySettings($null, $bi, [ref]$dm); $dm.f = 0x180000; "ChangeDisplaySettings: $([Res]::ChangeDisplaySettings([ref]$dm, 0))" }
          Start-Sleep -Seconds 3
          node test/store-shots.js (Resolve-Path node_modules/electron/dist/electron.exe).Path "$env:RUNNER_TEMP\shots" . 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\shots-log.txt"
      - name: Publish package and report (pre-release store-v<version>)
        if: always()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          $ver = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $files = @("$env:RUNNER_TEMP\store-report.txt")
          $files += Get-ChildItem "$env:RUNNER_TEMP\shots\*.png" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          if (Test-Path "$env:RUNNER_TEMP\shots-log.txt") { $files += "$env:RUNNER_TEMP\shots-log.txt" }
          $w = Join-Path $env:RUNNER_TEMP 'wack.xml'; if (Test-Path $w) { $files += $w }
          $p = Get-ChildItem desktop/dist/*.appx -ErrorAction SilentlyContinue | Select-Object -First 1; if ($p) { $files += $p.FullName }
          gh release delete "store-v$ver" --cleanup-tag --yes 2>$null
          gh release create "store-v$ver" @files --target $env:GITHUB_SHA --prerelease --title "Dilia PDF Microsoft Store package $ver" --notes "Unsigned .appx for upload to Partner Center (the Store signs it). Not for installing on your PC."
