name: security
on:
  push: { branches: [main, staging] }
  pull_request:
  schedule: [{ cron: '17 5 * * 1' }]
permissions: { contents: read, security-events: write }
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Dilia static gate (inline scripts, eval, remote URLs, vendor hashes, licences)
        run: python3 dev/security-check.py
      - name: Known vulnerabilities in vendored libraries (npm advisories, OSV fallback)
        run: python3 dev/vendor-audit.py
      - name: Secret scan (plus GitHub push protection)
        run: |
          python3 -m pip install --user --break-system-packages --quiet detect-secrets || python3 -m pip install --user --quiet detect-secrets
          export PATH="$HOME/.local/bin:$PATH"
          detect-secrets scan --all-files --exclude-lines 'getRandomValues' $(git ls-files | grep -v '^assets/vendor/' | grep -v '^desktop/package-lock.json$' | grep -v '^dev/vendor-hashes.json$') | python3 -c "import sys,json;d=json.load(sys.stdin)['results'];print(d or 'no secrets');sys.exit(1 if d else 0)"
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with: { languages: javascript-typescript, config: "paths-ignore: [assets/vendor]" }
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
