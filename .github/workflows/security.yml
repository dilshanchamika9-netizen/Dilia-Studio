name: security
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: '17 5 * * 1' }]
permissions: { contents: read, security-events: write }
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Dilia static gate (inline scripts, eval, remote URLs, vendor hashes, licences)
        run: python3 dev/security-check.py
      - name: Secret scan (plus GitHub push protection)
        run: |
          pip install --quiet detect-secrets
          detect-secrets scan --all-files --exclude-lines 'getRandomValues' $(git ls-files | grep -v '^assets/vendor/') | python3 -c "import sys,json;d=json.load(sys.stdin)['results'];print(d or 'no secrets');sys.exit(1 if d else 0)"
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with: { languages: javascript-typescript, config: "paths-ignore: [assets/vendor]" }
      - uses: github/codeql-action/analyze@v4
